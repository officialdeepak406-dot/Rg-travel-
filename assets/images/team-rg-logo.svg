<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">TEAM RG Travel Hub</title><desc id="desc">TEAM RG in chrome silver, red A, yellow R, with Travel Hub and A Travel in Chennai beneath</desc>
<defs>
 <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".22" stop-color="#b9c0c9"/><stop offset=".46" stop-color="#fff"/><stop offset=".7" stop-color="#8d98a5"/><stop offset="1" stop-color="#f5f7fa"/></linearGradient>
 <linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe64d"/><stop offset=".5" stop-color="#ffd000"/><stop offset="1" stop-color="#d99a00"/></linearGradient>
 <filter id="depth" x="-10%" y="-20%" width="120%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dy="4"/><feComponentTransfer><feFuncA type="linear" slope=".75"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g filter="url(#depth)" font-family="Arial Black,Impact,sans-serif" font-style="italic" font-weight="900" text-anchor="middle" stroke="#111923" stroke-width="13" stroke-linejoin="round" paint-order="stroke fill">
 <text x="245" y="174" font-size="170" fill="url(#chrome)" textLength="390" lengthAdjust="spacingAndGlyphs">TE</text>
 <text x="472" y="174" font-size="170" fill="#f20d1b">A</text>
 <text x="625" y="174" font-size="170" fill="url(#chrome)">M</text>
 <text x="795" y="174" font-size="170" fill="url(#yellow)">R</text>
 <text x="920" y="174" font-size="170" fill="url(#chrome)">G</text>
</g>
<path d="M405 142 Q475 83 548 136" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
<g text-anchor="middle" font-family="Arial,sans-serif" font-style="italic" font-weight="900" fill="url(#chrome)" stroke="#17202c" stroke-width="2.5" paint-order="stroke">
 <text x="500" y="242" font-size="54" letter-spacing="17">TRAVEL HUB</text>
 <text x="500" y="286" font-size="23" letter-spacing="11">A TRAVEL IN CHENNAI</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 520" role="img" aria-labelledby="title desc">
<title id="title">RG TRAVEL — A Travel in Chennai</title>
<desc id="desc">RG TRAVEL in metallic silver, yellow and red lettering with the tagline A Travel in Chennai.</desc>
<defs>
  <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".2" stop-color="#aeb7c2"/>
    <stop offset=".43" stop-color="#ffffff"/><stop offset=".68" stop-color="#8995a2"/>
    <stop offset="1" stop-color="#f8fafc"/>
  </linearGradient>
  <linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffe94f"/><stop offset=".52" stop-color="#ffd000"/>
    <stop offset="1" stop-color="#d89b00"/>
  </linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ff343d"/><stop offset="1" stop-color="#d90012"/>
  </linearGradient>
  <filter id="depth" x="-12%" y="-18%" width="124%" height="145%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
    <feOffset in="blur" dx="0" dy="7" result="offset"/>
    <feComponentTransfer in="offset" result="shadow"><feFuncA type="linear" slope=".75"/></feComponentTransfer>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<g filter="url(#depth)" font-family="Arial Black,Impact,sans-serif" font-style="italic" font-weight="900" font-size="250" text-anchor="middle" stroke="#101820" stroke-width="19" stroke-linejoin="round" paint-order="stroke fill">
  <text x="205" y="290" fill="url(#yellow)">R</text>
  <text x="430" y="290" fill="url(#chrome)">G</text>
  <text x="700" y="290" fill="url(#chrome)">T</text>
  <text x="885" y="290" fill="url(#chrome)">R</text>
  <text x="1070" y="290" fill="url(#red)">A</text>
  <text x="1260" y="290" fill="url(#chrome)">V</text>
  <text x="1450" y="290" fill="url(#chrome)">E</text>
  <text x="1630" y="290" fill="url(#chrome)">L</text>
</g>
<path d="M965 246 Q1060 150 1170 226" fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round"/>
<g fill="url(#chrome)" stroke="#15202b" stroke-width="3" paint-order="stroke" font-family="Arial,sans-serif" font-style="italic" font-weight="900" text-anchor="middle">
  <text x="900" y="410" font-size="62" letter-spacing="20">A TRAVEL IN CHENNAI</text>
</g>
<path d="M150 395 H410 M1390 395 H1650" stroke="url(#chrome)" stroke-width="10" stroke-linecap="round"/>
</svg>